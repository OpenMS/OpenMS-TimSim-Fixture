[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openms-timsim-fixture"
version = "0.1.0"
description = "Reproducible TimSim synthetic DIA fixtures for OpenMS/OpenDIA identification, quantification, and entrapment testing."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "imspy-simulation==0.4.2",
]

[project.optional-dependencies]
benchmark = [
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.1",
  "pyarrow>=15",
  "scipy>=1.11",
]
test = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openms_timsim_fixture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
